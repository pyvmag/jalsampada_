services:
  jalsampada-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jalsampada-ui
    restart: always
    ports:
      - "2225:2225"
    environment:
      - NODE_ENV=production
      - PORT=2225
      - HOSTNAME=0.0.0.0
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
